
# NETOWRK SIMULATION GENERATED WITH ASSISTANCE FROM VARIOUS AI TOOLS.
# ALL AI-GENERATED CONTENT WAS REVIEWED, REVISED, AND ADAPTED TO MEET STR SENTINEL REQUIREMENTS.


networks:
  str_simulation_net:
    name: str_sentinel_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:
  # Hikvision Camera (HTTP) - Realistic headers that Recog understands
  camera:
    image: nginx:alpine
    container_name: str_camera_hikvision
    mac_address: "00:40:8C:11:22:33"  # 00:40:8C = real Hikvision OUI
    networks:
      str_simulation_net:
        ipv4_address: 172.20.0.10
    ports:
      - "8081:80"
    command: /bin/sh -c "echo 'server { listen 80; server_tokens off; location / { root /usr/share/nginx/html; index index.html; add_header Server \"Hikvision-Webs\" always; add_header WWW-Authenticate \"Basic realm=Hikvision DS-2CD2032-I\" always; } }' > /etc/nginx/conf.d/default.conf && echo '<html><head><title>Hikvision DS-2CD2032-I Network Camera</title></head><body><h1>Network Camera</h1><p>Please log in to access device</p></body></html>' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"

  # Cisco Router (SSH). Common in rental properties for network management
  # Network Device with SSH (OpenSSH)
  router:
    platform: linux/amd64
    image: rastasheep/ubuntu-sshd
    container_name: str_router_cisco
    mac_address: "00:1E:14:AA:BB:CC"  # 00:1E:14 = Cisco Systems OUI (realistic for routers/switches)
    networks:
      str_simulation_net:
        ipv4_address: 172.20.0.20
    environment:
      - USER_PASSWORD=root
    ports:
      - "2222:22"
    command: >
      sh -c "echo 'Cisco-1.25' > /etc/ssh/sshd_banner &&
             sed -i 's|#Banner none|Banner /etc/ssh/sshd_banner|' /etc/ssh/sshd_config &&
             /usr/sbin/sshd -D"

  # Apple TV (mDNS/AirPlay)
  appletv:
    image: flungo/avahi
    container_name: str_appletv_mdns
    mac_address: "00:03:93:12:34:56"  # 00:03:93 = official Apple OUI
    networks:
      str_simulation_net:
        ipv4_address: 172.20.0.35
    volumes:
      - ./nest.service:/etc/avahi/services/appletv.service:ro
    environment:
      - REFLECTOR_ENABLE_REFLECTOR=yes

  # THE SENTINEL APP (The Scanner Container)
  sentinel:
    build: ../app        # Tells Docker to look in the app/ folder for the Dockerfile
    container_name: str_sentinel_app
    command: tail -f /dev/null  # Keeps container running for interactive use
    networks:
      str_simulation_net:
        ipv4_address: 172.20.0.50
    ports:
      - "5001:5001"      # Dashboard web interface
    volumes:
      - ../app:/app      # Syncs code so I can edit main.py without rebuilding
      - ../test:/test    # Test scripts and data
    cap_add:
      - NET_ADMIN        # Essential for scanner to "sniff" the network
    depends_on:
      - camera
      - router
      - appletv